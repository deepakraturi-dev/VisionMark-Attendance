{% extends "base.html" %}

{% block title %}Reports | Smart Attendance{% endblock %}

{% block content %}
<header class="page-header">
  <div>
    <h1>Reports</h1>
    <p class="muted">Export attendance and behavior data as CSV or PDF</p>
  </div>
</header>

<section class="content-grid three-columns">
  <article class="panel">
    <h2 style="margin-bottom:14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:text-bottom;margin-right:6px"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Daily Attendance
    </h2>
    <form class="form-grid" method="get">
      <label>
        <span>Date</span>
        <input type="date" name="date" value="{{ today.isoformat() }}">
      </label>
      <div class="button-row">
        <button class="button button-primary" formaction="{{ url_for('daily_attendance_csv') }}" type="submit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          CSV
        </button>
        <button class="button button-ghost" formaction="{{ url_for('daily_attendance_pdf') }}" type="submit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          PDF
        </button>
      </div>
    </form>
  </article>

  <article class="panel">
    <h2 style="margin-bottom:14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:text-bottom;margin-right:6px"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>
      Monthly Summary
    </h2>
    <form class="form-grid" method="get" action="{{ url_for('monthly_attendance_csv') }}">
      <label>
        <span>Month</span>
        <input type="month" name="month" value="{{ today.strftime('%Y-%m') }}">
      </label>
      <button class="button button-primary" type="submit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        CSV
      </button>
    </form>
  </article>

  <article class="panel">
    <h2 style="margin-bottom:14px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:text-bottom;margin-right:6px"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      Behavior Report
    </h2>
    <form class="form-grid" method="get">
      <label>
        <span>Date</span>
        <input type="date" name="date" value="{{ today.isoformat() }}">
      </label>
      <div class="button-row">
        <button class="button button-primary" formaction="{{ url_for('behavior_csv') }}" type="submit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          CSV
        </button>
        <button class="button button-ghost" formaction="{{ url_for('behavior_pdf') }}" type="submit">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          PDF
        </button>
      </div>
    </form>
  </article>
</section>
{% endblock %}
